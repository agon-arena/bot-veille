name: Collecte automatique bot veille

on:
  schedule:
    # Vérification toutes les 5 min (au lieu de 15) : GitHub ne garantit pas
    # l'exécution exacte des cron schedule et peut sauter des occurrences sous
    # charge (cf. incident du 10/07/2026 : aucun run entre 12h36 et 15h19 UTC,
    # créneau de 18h00 Réunion entièrement raté). Repo public → minutes gratuites
    # illimitées, augmenter la fréquence ne coûte rien. La collecte elle-même ne
    # se déclenche réellement que si l'heure configurée (± tolérance côté serveur)
    # est atteinte.
    - cron: '*/5 * * * *'
  workflow_dispatch:  # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier/déclencher la collecte
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.BOT_VEILLE_URL }}/api/auto-collect-tick?token=${{ secrets.BOT_VEILLE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10)
          echo "HTTP $HTTP_STATUS — $(cat /tmp/response.txt)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Erreur (HTTP $HTTP_STATUS)" && exit 1
          fi

      # Même tick externe, même serveur, mais endpoint/pipeline indépendant (sortir-auto-ingest.js) :
      # if: always() pour qu'un échec de la collecte presse ci-dessus n'empêche jamais ce tick d'être
      # tenté — ce sont deux pipelines indépendants, aucune raison que l'un bloque l'autre.
      - name: Vérifier/déclencher l'ingestion Sortir (OpenAgenda)
        if: always()
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response-sortir.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.BOT_VEILLE_URL }}/api/sortir-ingest-tick?token=${{ secrets.BOT_VEILLE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10)
          echo "HTTP $HTTP_STATUS — $(cat /tmp/response-sortir.txt)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Erreur (HTTP $HTTP_STATUS)" && exit 1
          fi

          # started confirme une acceptation, jamais la réussite d'une collecte.
          node sortir/check-scheduler-response.js tick /tmp/response-sortir.txt > /tmp/tick-check.json
          ACTION=$(jq -r .action /tmp/tick-check.json)
          if [ "$ACTION" = "skipped" ]; then
            echo "Tick sans nouvelle ingestion ; aucune réussite de collecte affirmée."
            exit 0
          fi
          CYCLE_ID=$(jq -r .cycleId /tmp/tick-check.json)
          DEADLINE=$((SECONDS + 150))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(curl -sS -o /tmp/cycle-status.json -w "%{http_code}" \
              "${{ secrets.BOT_VEILLE_URL }}/api/sortir-ingest-status?cycleId=$CYCLE_ID&token=${{ secrets.BOT_VEILLE_TOKEN }}" \
              --max-time 15)
            if [ "$STATUS" != "200" ]; then
              echo "Statut durable inaccessible (HTTP $STATUS) ; cycle non confirmé."; exit 1
            fi
            cat /tmp/cycle-status.json
            node sortir/check-scheduler-response.js cycle /tmp/cycle-status.json > /tmp/cycle-check.json
            if [ "$(jq -r .action /tmp/cycle-check.json)" = "success" ]; then
              echo "Cycle terminé et producteurs réussis, résultat durable confirmé."; exit 0
            fi
            sleep 5
          done
          echo "Cycle encore en cours : résultat non confirmé, consulter le journal durable."
          exit 1
